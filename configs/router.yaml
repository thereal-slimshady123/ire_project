# Router configuration: feature lists, model types, hyperparams, class weights
features:
  query_features:
    - "query_length"
    - "max_idf"
    - "mean_idf"
    - "rare_term_density"
    - "entity_density"
    - "oov_fraction"
  retrieval_signal_features:
    - "jaccard_overlap_top10"
    - "jaccard_overlap_top20"
    - "rank_correlation_spearman"
    - "bm25_top1_score"
    - "bm25_top1_top2_gap"
    - "bm25_score_entropy"
    - "dense_top1_score"
    - "dense_top1_top2_gap"
    - "dense_score_entropy"

models:
  logistic:
    class_weight: "balanced"
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"

  gbm:
    model_type: "lightgbm"  # or "xgboost"
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 31
    class_weight: "balanced"
    use_regret_weights: true

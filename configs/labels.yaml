# Labeling configuration: margin-based argmax labels
# best_route = argmax over {bm25, dense, hybrid(alpha*)} of the metric;
# if top1 - top2 < epsilon the label falls back to hybrid (safe default).
# Regret (best - route score) is kept per route and used only as training sample weights.
# epsilon is selected on dev by downstream routed nDCG@10 (see scripts/train_router.py).
# nDCG@10 moves in coarse steps on single-relevant datasets, so very small epsilons filter almost nothing.
epsilon_grid: [0.02, 0.05, 0.10, 0.15]
default_epsilon: 0.05
metric: "ndcg_cut_10"
fallback_route: "hybrid"

# Labeling configuration: epsilon margin threshold grid and strategies
epsilon_grid: [0.0, 0.01, 0.02, 0.05, 0.10]
default_epsilon: 0.02
metric: "ndcg_cut_10"
labeling_strategy: "margin_argmax"  # options: "margin_argmax", "regret_weighted"
fallback_route: "hybrid"  # route when top routes are within margin epsilon

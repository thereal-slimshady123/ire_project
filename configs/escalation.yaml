# Escalation configuration: confidence-based routing (selective classification)
# A query is escalated when max(router class probability) < tau.
# tau is calibrated on DEV probabilities (out-of-sample) so that the dev escalation rate hits each target;
# training-set probabilities are overconfident and must not be used for calibration.
target_escalation_rates: [0.05, 0.10, 0.15]
calibration_split: "dev"
escalation_action: "cross_encoder_rerank"  # see cross_encoder.yaml for the candidate pool

# Number of evenly spaced escalation rates (0..1) for the risk-coverage curve.
risk_coverage_points: 21

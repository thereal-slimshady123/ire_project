# Cross-encoder escalation backend configuration
model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
batch_size: 16
max_length: 512
device: "cuda"  # falls back to cpu if CUDA is unavailable

# Escalation candidate pool:
#   1. union of BM25 top-100 and dense top-100
#   2. ordered by hybrid score (alpha*)
#   3. the top `rerank_depth` are reranked by the cross-encoder
#   4. the remaining hybrid-ordered docs are appended after them, up to `output_depth`
rerank_depth: 50
output_depth: 100

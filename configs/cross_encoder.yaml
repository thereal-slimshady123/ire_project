# Cross-encoder escalation backend configuration
model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
# Model identifiers available to the explicit reranker benchmark. No checkpoint is
# assumed to improve quality until evaluated on the same held-out candidate pools.
candidate_models:
  - "cross-encoder/ms-marco-MiniLM-L-6-v2"
  - "cross-encoder/ms-marco-MiniLM-L-12-v2"
  - "BAAI/bge-reranker-base"
batch_size: 32
max_length: 512
device: "cpu"

# Candidate pool settings
candidate_pool_size: 50  # candidate pool size union top-k (30, 50, or 100)
top_k_rerank: 10

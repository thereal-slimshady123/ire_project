[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "router-retrieval"
version = "0.1.0"
description = "Confidence-Based Query Router for Hybrid Retrieval"
readme = "README.md"
authors = [
    { name = "IRE Project Team" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.65.0",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pytrec-eval-terrier>=0.5.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]
# Only needed by scripts/demo_synthetic_routing.py (smoke test, not part of the main pipeline)
demo = [
    "rank-bm25>=0.2.2"
]

[tool.setuptools.packages.find]
where = ["src"]
